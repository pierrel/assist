name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e .
      # Docker is pre-installed on ubuntu-latest runners; build the
      # sandbox + egress-proxy images so the e2e integration tests
      # (tests/test_sandbox_egress_integration.py) can spin up real
      # containers.  No skip — the egress contract is too important
      # to silently no-op in CI.
      - name: Build sandbox images
        run: make sandbox-build
      - name: Sandbox smoke (push-refusal + egress + integration)
        run: make sandbox-smoke
      # `make sandbox-smoke` above already ran the e2e integration
      # tests; exclude them here so we don't pay for them twice. The fresh-process
      # census byte-stability probe runs two independently bounded full captures,
      # so keep that local-only rather than let the module's 60s per-test cap race
      # CI scheduling.
      - name: Unit tests
        run: .venv/bin/pytest tests/ -vv --ignore=tests/test_sandbox_egress_integration.py --deselect=tests/test_prompt_census.py::test_two_fresh_process_captures_are_byte_stable
