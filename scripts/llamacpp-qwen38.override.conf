# Install manually as /etc/systemd/system/llamacpp.service.d/qwen38.conf.
# The empty ExecStart resets the old Qwen3.6 launcher.  The existing unit's
# WorkingDirectory is the llama.cpp root, so bash resolves the staged script
# there without embedding a host path.
[Service]
Environment=ENABLE_VISION=0
Environment=REASONING=on
Environment=REASONING_EFFORT=low
Environment=REASONING_PRESERVE=0
ExecStart=
ExecStart=/usr/bin/bash scripts/serve-qwen38.sh
